#User Configuration

#OE_TERMINAL = "tmux"
INHERIT += "rm_work"

# No SD card image (wic, added by meta-enclustra-refdes for the SD boot mode): the boot files and
# the ext4 rootfs are copied to the SD card by hand (PETALINUX_2024.1/README.md).
IMAGE_FSTYPES:remove = "wic wic.gz wic.bmap"
# No JFFS2 image (raw flash file system; the rootfs is on the SD card)
IMAGE_FSTYPES:remove = "jffs2"

