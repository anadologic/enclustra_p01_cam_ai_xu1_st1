# ----------------------------------------------------------------------------------------------------
# meta-p01-yocto - Yocto-only settings (AMD rel-v2024.1, langdale).
# What PetaLinux generates from project-spec/configs (machine, system-conf.dtsi, users, hostname,
# network, image content) is written here by hand. The product itself (p01-app, device-tree
# additions, DPU driver, VART) is in ../../layers/meta-p01, shared with the PetaLinux project.
# ----------------------------------------------------------------------------------------------------
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "p01-yocto"
BBFILE_PATTERN_p01-yocto = "^${LAYERDIR}/"
BBFILE_PRIORITY_p01-yocto = "30"

LAYERDEPENDS_p01-yocto = "core xilinx xilinx-tools petalinux enclustra-refdes p01"
LAYERSERIES_COMPAT_p01-yocto = "langdale"

# Repository root (holds VIVADO_2024.1, PETALINUX_2024.1 and layers)
P01_ROOT := "${@os.path.normpath('${LAYERDIR}/../..')}"
