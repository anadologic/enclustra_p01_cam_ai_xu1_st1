#@TYPE: Machine
#@NAME: p01-xu1-st1-xczu6eg
#@DESCRIPTION: ME-XU1-6EG-1I-D12E + ME-ST1, P01 hardware (VIVADO_2024.1/export/p01_xu1_st1.xsa), SD boot
#
# Same settings as the machine file PetaLinux generates (gen-machineconf) for the P01 XSA, on top
# of the Enclustra refdes-xu1-st1 machine; override enclustra-sd = SD card boot mode.
# The name must contain the device type: meta-enclustra-module (zynqmp-override.inc) derives
# SOC_VARIANT from MACHINE ("eg" -> zynqmp-eg-generic.conf, MACHINE_FEATURES mali400).

MACHINEOVERRIDES =. "${@['', 'p01-xu1-st1-xczu6eg:']['p01-xu1-st1-xczu6eg' != '${MACHINE}']}"
MACHINEOVERRIDES .= ":enclustra-sd"

YAML_CONSOLE_DEVICE_CONFIG:pn-device-tree ?= "psu_uart_0"
YAML_MAIN_MEMORY_CONFIG:pn-device-tree ?= "PSU_DDR_0"
DT_PADDING_SIZE:pn-device-tree ?= "0x1000"
DTC_FLAGS:pn-device-tree ?= "-@"
YAML_DT_BOARD_FLAGS ?= "{BOARD template}"

UBOOT_MACHINE ?= "xilinx_zynqmp_virt_defconfig"
ATF_CONSOLE ?= "cadence"
TFA_BL33_LOAD ?= "0x8000000"

YAML_SERIAL_CONSOLE_STDIN:pn-pmu-firmware ?= "psu_uart_0"
YAML_SERIAL_CONSOLE_STDOUT:pn-pmu-firmware ?= "psu_uart_0"
YAML_SERIAL_CONSOLE_STDIN:pn-fsbl-firmware ?= "psu_uart_0"
YAML_SERIAL_CONSOLE_STDOUT:pn-fsbl-firmware ?= "psu_uart_0"
YAML_SERIAL_CONSOLE_BAUDRATE ?= "115200"

UBOOT_ENTRYPOINT ?= "0x200000"
UBOOT_LOADADDRESS ?= "0x200000"
SERIAL_CONSOLES ?= "115200;ttyPS0"
DDR_BASEADDR ?= "0x0"
SKIP_APPEND_BASEADDR ?= "0"

require conf/machine/refdes-xu1-st1.conf

# Hardware description: the P01 XSA with bitstream (device tree, FSBL, PMU firmware, BOOT.BIN).
# It is written by the hardware build (VIVADO_2024.1/scripts/build_all.sh), not kept in the repository.
HDF_EXT = "xsa"
HDF_BASE = "file://"
HDF_PATH = "${P01_ROOT}/VIVADO_2024.1/export/p01_xu1_st1.xsa"

PACKAGE_EXTRA_ARCHS:append = "${@['', ' p01_xu1_st1_xczu6eg']['p01-xu1-st1-xczu6eg' != '${MACHINE}']}"
