# ----------------------------------------------------------------------------------------------------
# meta-p01 - product layer, used by the PetaLinux project (CONFIG_USER_LAYER) and by the Yocto build:
# the p01-app application, the device-tree additions for the P01 hardware, the DPU kernel driver and
# VART without XRT.
# ----------------------------------------------------------------------------------------------------
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "p01"
BBFILE_PATTERN_p01 = "^${LAYERDIR}/"
BBFILE_PRIORITY_p01 = "25"

LAYERDEPENDS_p01 = "core xilinx"
LAYERSERIES_COMPAT_p01 = "langdale"

# VART without XRT: applied only when meta-vitis (collection vitis-ai) is in the build. No hard
# LAYERDEPENDS on vitis-ai, so the layer can be added before meta-vitis (PetaLinux adds the user
# layers of a new project in its own order).
BBFILES_DYNAMIC += "vitis-ai:${LAYERDIR}/dynamic-layers/vitis-ai/recipes-*/*/*.bbappend"
